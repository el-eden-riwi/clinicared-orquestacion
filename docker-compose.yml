x-airflow-common: &airflow-common
  build: .
  image: clinicared-airflow-spark:2.9.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:Jeas888@clinicared_postgres:5432/clinicared_db
    - AIRFLOW__CELERY__BROKER_URL=amqp://guest:guest@clinicared_rabbitmq:5672//
    - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://postgres:Jeas888@clinicared_postgres:5432/clinicared_db
    - AIRFLOW__CORE__FERNET_KEY=46Bk3sQVlPPOexq0OHOZnIlNepKFf87WfwLbfzqJZPo=
    - AIRFLOW__WEBSERVER__SECRET_KEY=clinicared_secret_key_airflow_2026
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CELERY__WORKER_CONCURRENCY=1
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__CORE__PARALLELISM=2
    - AIRFLOW__CORE__DAG_CONCURRENCY=2
    - AIRFLOW__SCHEDULER__PARSING_PROCESSES=1
    - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=30
    - PYTHONPATH=/opt/airflow
    - RABBITMQ_HOST=clinicared_rabbitmq
    - CLINICARED_API_URL=${CLINICARED_API_URL}
    - RDS_DB_HOST=${RDS_DB_HOST}
    - RDS_DB_PORT=${RDS_DB_PORT}
    - RDS_DB_NAME=${RDS_DB_NAME}
    - RDS_DB_USER=${RDS_DB_USER}
    - RDS_DB_PASSWORD=${RDS_DB_PASSWORD}
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - AIRFLOW__API__ACCESS_CONTROL_ALLOW_ORIGINS=*
    - AIRFLOW__API__ACCESS_CONTROL_ALLOW_METHODS=GET,POST,OPTIONS
    - AIRFLOW__API__ACCESS_CONTROL_ALLOW_HEADERS=Content-Type,Authorization
  volumes:
    - ./dags:/opt/airflow/dags
    - ../clinicared-backend/src:/opt/airflow/src:ro
    - ./spark_jobs:/opt/airflow/spark_jobs

services:
  airflow-init:
    <<: *airflow-common
    container_name: clinicared_airflow_init
    command: version && airflow db migrate && airflow users create --username admin --firstname Jeas --lastname Ayala --role Admin --email jeas@clinicared.com --password admin
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: clinicared_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: clinicared_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: clinicared_airflow_worker
    command: celery worker
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    name: clinicared_network
    external: true