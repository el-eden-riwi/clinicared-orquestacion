x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment:
    - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:Jeas888@clinicared_postgres:5432/clinicared_db
    - AIRFLOW__CELERY__BROKER_URL=amqp://guest:guest@clinicared_rabbitmq:5672//
    - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://postgres:Jeas888@clinicared_postgres:5432/clinicared_db
    - AIRFLOW__CORE__FERNET_KEY=46Bk3sQVlPPOexq0OHOZnIlNepKFf87WfwLbfzqJZPo=
    - AIRFLOW__WEBSERVER__SECRET_KEY=clinicared_secret_key_airflow_2026
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CELERY__WORKER_CONCURRENCY=1
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__CORE__PARALLELISM=2
    - AIRFLOW__CORE__DAG_CONCURRENCY=2
    - AIRFLOW__SCHEDULER__PARSING_PROCESSES=1
    - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=30
    - PYTHONPATH=/opt/airflow
    - _PIP_ADDITIONAL_REQUIREMENTS=pika pydantic-settings
    - RABBITMQ_HOST=clinicared_rabbitmq
  volumes:
    - ./dags:/opt/airflow/dags

services:
  airflow-init:
    <<: *airflow-common
    container_name: clinicared_airflow_init
    command: version && airflow db migrate && airflow users create --username admin --firstname Jeas --lastname Ayala --role Admin --email admin@clinicared.com --password admin
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: clinicared_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: clinicared_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: clinicared_airflow_worker
    command: celery worker
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    name: clinicared_network
    external: true